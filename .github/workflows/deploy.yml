name: Deploy to Netlify

# 推送到 main 就自动构建并上线。部署逻辑和本地 scripts/netlify-deploy.mjs 等价：
# 跑 node build.mjs 生成 dist，再用 Netlify 官方 CLI 上传。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 构建
        run: node build.mjs

      - name: 自检（链接与 title/description）
        run: node scripts/check-links.mjs

      - name: 部署到 Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: npx --yes netlify-cli@latest deploy --prod --dir=dist --site "$NETLIFY_SITE_ID"
